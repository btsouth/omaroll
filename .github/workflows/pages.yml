name: Pages

# The homepage shows the latest release, not main, so its commands always work
# with what people can install. Release dispatches this after publishing: a
# release made with the workflow token starts no release event, and the
# github-pages environment only deploys from main. Run it by hand to redeploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to publish (empty for the latest release)
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pick the release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
        run: |
          ref="${REQUESTED:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          test -n "$ref"
          echo "Publishing $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      # The homepage sits at the root. Media stays under docs/ so links to
      # the demo from older READMEs and posts keep working.
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp docs/site/* resources/icons/omaroll.svg _site/
          cp docs/*.png docs/*.webp docs/*.mp4 _site/docs/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
