name: CI

on:
  # Branches are covered by their pull request; pushing to a PR branch would
  # otherwise run everything twice.
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!.github/ISSUE_TEMPLATE/**'
      # The build reads these Markdown files (CMakeLists.txt installs or
      # rewrites them), so renaming or deleting one must still run CI.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'PRIVACY.md'
      - 'SUPPORT.md'
      - 'CHANGELOG.md'
      - 'docs/STATUS.md'
      - 'docs/ROADMAP.md'
      - 'tests/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!.github/ISSUE_TEMPLATE/**'
      # The build reads these Markdown files (CMakeLists.txt installs or
      # rewrites them), so renaming or deleting one must still run CI.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'PRIVACY.md'
      - 'SUPPORT.md'
      - 'CHANGELOG.md'
      - 'docs/STATUS.md'
      - 'docs/ROADMAP.md'
      - 'tests/**'

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # Compiler output is validated against source/dependencies and compiler
      # content by ccache; package builds stay clean and all tests still run.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        # x86_64 releases build on Omarchy stable; current Arch catches newer
        # Qt early. Omarchy has no aarch64 stable mirror, so ARM builds against
        # current Arch Linux ARM.
        include:
          - check: omarchy-stable
            packages: omarchy-stable
            runner: ubuntu-latest
            container: archlinux:latest
          - check: arch
            packages: arch
            runner: ubuntu-latest
            container: archlinux:latest
          - check: aarch64
            packages: arch
            runner: ubuntu-24.04-arm
            # The pacman download sandbox does not work in this container.
            pacman_flags: --disable-sandbox
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    name: build-and-test (${{ matrix.check }})
    steps:
      - name: Use Omarchy stable packages
        if: matrix.packages == 'omarchy-stable'
        run: echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        run: >-
          pacman -Syyuu ${{ matrix.pacman_flags }} --noconfirm --needed
          appstream base-devel ccache cmake desktop-file-utils ffmpeg ffmpegthumbnailer
          git imagemagick kimageformats libavif libheif libraw ninja pkgconf poppler python qt6-base
          qt6-declarative qt6-imageformats qt6-multimedia qt6-svg qt6-wayland
          wl-clipboard xdg-desktop-portal xdg-utils mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore compiler outputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v1-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/release --target all omaroll_benchmark_library
      - name: Check the build runs on Omarchy stable
        if: matrix.packages == 'omarchy-stable'
        run: bash packaging/arch/check-omarchy-stable.sh build/release/omaroll
      - name: Test
        run: ctest --test-dir build/release --output-on-failure --output-junit test-results.xml
      - name: Test rendered media with Mesa OpenGL
        run: xvfb-run -a bash tests/run-opengl.sh build/release
      - name: Check startup readiness (informational timings)
        run: xvfb-run -a python3 tests/benchmark_startup.py build/release/omaroll --runs 1 > build/release/startup.json
      - name: Save rendered views
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengl-renders-${{ matrix.check }}
          path: |
            build/release/opengl-renders/*.png
            build/release/startup.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate metadata
        run: |
          desktop-file-validate packaging/io.github.tsouth89.omaroll.desktop
          appstreamcli validate packaging/io.github.tsouth89.omaroll.metainfo.xml
      - name: Verify staged install
        run: |
          DESTDIR="$PWD/stage" cmake --install build/release
          test -x stage/usr/local/bin/omaroll
          test -f stage/usr/local/share/applications/io.github.tsouth89.omaroll.desktop
          test -f stage/usr/local/share/metainfo/io.github.tsouth89.omaroll.metainfo.xml
          test -f stage/usr/local/share/icons/hicolor/scalable/apps/io.github.tsouth89.omaroll.svg
          test -f stage/usr/local/share/licenses/omaroll/LICENSE
          test -f stage/usr/local/share/doc/omaroll/README.md
          desktop-file-validate stage/usr/local/share/applications/io.github.tsouth89.omaroll.desktop
          appstreamcli validate stage/usr/local/share/metainfo/io.github.tsouth89.omaroll.metainfo.xml
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save compiler outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.job }}-${{ matrix.check }}-${{ runner.arch }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7

  # AddressSanitizer and UndefinedBehaviorSanitizer on the current Arch
  # packages. The release build above hides memory errors and undefined
  # behavior that only a Debug sanitizer build reports, so they run as their
  # own job and gate the pull request like the rest of CI. The rendered-media
  # matrix stays in the release job: it is slow under sanitizers and adds no
  # coverage that the suites below do not already reach.
  sanitizers:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: archlinux:latest
    name: sanitizers (address, undefined)
    env:
      # UBSan reports abort so the first finding fails the run; ASan keeps its
      # defaults. Leak detection stays on for the suites that negotiate it in
      # CMake.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syyuu --noconfirm --needed
          appstream base-devel cmake desktop-file-utils ffmpeg ffmpegthumbnailer
          git imagemagick kimageformats libavif libheif libraw ninja pkgconf poppler python qt6-base
          qt6-declarative qt6-imageformats qt6-multimedia qt6-svg qt6-wayland
          wl-clipboard xdg-desktop-portal xdg-utils mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure (Debug, ASan + UBSan)
        run: >-
          cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/asan
      - name: Test
        run: ctest --test-dir build/asan --output-on-failure --output-junit test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-sanitizers
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7
