name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream base-devel cmake desktop-file-utils ffmpeg ffmpegthumbnailer
          git imagemagick kimageformats libavif libheif ninja pkgconf poppler qt6-base
          qt6-declarative qt6-imageformats qt6-multimedia qt6-svg qt6-wayland
          wl-clipboard xdg-desktop-portal xdg-utils mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Test rendered media with Mesa OpenGL
        run: xvfb-run -a bash tests/run-opengl.sh build/release
      - name: Save rendered views
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengl-renders
          path: build/release/opengl-renders/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate metadata
        run: |
          desktop-file-validate packaging/io.github.tsouth89.omaroll.desktop
          appstreamcli validate packaging/io.github.tsouth89.omaroll.metainfo.xml
      - name: Verify staged install
        run: |
          DESTDIR="$PWD/stage" cmake --install build/release
          test -x stage/usr/local/bin/omaroll
          test -f stage/usr/local/share/applications/io.github.tsouth89.omaroll.desktop
          test -f stage/usr/local/share/metainfo/io.github.tsouth89.omaroll.metainfo.xml
          test -f stage/usr/local/share/icons/hicolor/scalable/apps/io.github.tsouth89.omaroll.svg
          test -f stage/usr/local/share/licenses/omaroll/LICENSE
          test -f stage/usr/local/share/doc/omaroll/README.md
          desktop-file-validate stage/usr/local/share/applications/io.github.tsouth89.omaroll.desktop
          appstreamcli validate stage/usr/local/share/metainfo/io.github.tsouth89.omaroll.metainfo.xml
