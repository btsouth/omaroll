name: Release

on:
  push:
    tags: ["v*"]
  # Changes to packaging run the whole release without publishing it.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/arch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Compiler output is validated against source/dependencies and compiler
  # content by ccache; package builds stay clean and all tests still run.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  # One source archive and PKGBUILD serve every architecture, so the published
  # checksum matches what each package was built from.
  source:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        run: |
          version="$(sed -n 's/^project(Omaroll VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
          grep -q "<release version=\"$version\"" packaging/io.github.tsouth89.omaroll.metainfo.xml
          grep -q "^## $version$" CHANGELOG.md
          grep -q "omaroll-$version-1-x86_64.pkg.tar.zst" README.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create source and PKGBUILD
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir source
          git archive --format=tar --prefix="omaroll-$VERSION/" \
            --output="source/omaroll-$VERSION.tar" HEAD
          gzip -n "source/omaroll-$VERSION.tar"
          source_sha="$(sha256sum "source/omaroll-$VERSION.tar.gz" | cut -d ' ' -f 1)"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SOURCE_SHA256@/$source_sha/g" \
            packaging/arch/PKGBUILD.in > "source/PKGBUILD-$VERSION"
      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: source/
          if-no-files-found: error

  package:
    needs: source
    timeout-minutes: 60
    name: package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against Omarchy's stable channel so the package runs on
          # stable, rc and edge. A build against newer Qt fails to start on
          # older Qt. Omarchy has no aarch64 stable mirror, so ARM builds
          # against current Arch Linux ARM.
          - arch: x86_64
            packages: omarchy-stable
            cache: omarchy-stable
            runner: ubuntu-latest
            container: archlinux:latest
          - arch: aarch64
            packages: arch
            cache: aarch64
            runner: ubuntu-24.04-arm
            container: menci/archlinuxarm:base-devel@sha256:5dda87d4b360dff28fe5ce27a20041949aa770a785c52daf82fc9956b2534c39
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - name: Use Omarchy stable packages
        if: matrix.packages == 'omarchy-stable'
        run: echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        # -uu lets the stable snapshot downgrade packages newer than it. The
        # pacman download sandbox does not work in the ARM container.
        run: >-
          pacman -Syyuu --disable-sandbox --noconfirm --needed
          appstream base-devel ccache cmake desktop-file-utils ffmpeg ffmpegthumbnailer
          git github-cli imagemagick kimageformats libavif libheif libraw ninja pkgconf poppler qt6-base
          qt6-declarative qt6-imageformats qt6-multimedia qt6-svg qt6-wayland
          wl-clipboard xdg-desktop-portal xdg-utils mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source
          path: source
      - name: Cache compiler outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-v1-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Check architecture
        run: test "$(uname -m)" = "$PACKAGE_ARCH"
      - name: Build and test
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure --output-junit test-results.xml
          desktop-file-validate packaging/io.github.tsouth89.omaroll.desktop
          appstreamcli validate packaging/io.github.tsouth89.omaroll.metainfo.xml
      - name: Test rendered media with Mesa OpenGL
        run: xvfb-run -a bash tests/run-opengl.sh build/release
      - name: Save rendered views
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengl-renders-release-${{ matrix.arch }}
          path: build/release/opengl-renders/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build package
        run: |
          mkdir package
          cp "source/omaroll-$VERSION.tar.gz" package/
          cp "source/PKGBUILD-$VERSION" package/PKGBUILD
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Arch Linux ARM's default package extension differs; the package
          # repository expects zstd.
          cp /etc/makepkg.conf /tmp/omaroll-makepkg.conf
          sed -i "s/^PKGEXT=.*/PKGEXT='.pkg.tar.zst'/" /tmp/omaroll-makepkg.conf
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/package' && makepkg --config /tmp/omaroll-makepkg.conf --cleanbuild --noconfirm"
          package_file="package/omaroll-$VERSION-1-$PACKAGE_ARCH.pkg.tar.zst"
          test -f "$package_file"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"
      - name: Test install, upgrade, removal and reinstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName 2>/dev/null || true)"
          previous_name=""
          if [ -n "$previous_tag" ]; then
            previous_name="$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq ".assets[].name | select(endswith(\"-$PACKAGE_ARCH.pkg.tar.zst\"))" \
              | head -n 1)"
          fi
          if [ -n "$previous_name" ]; then
            mkdir previous-release
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$previous_name" --dir previous-release
            pacman -U --noconfirm "previous-release/$previous_name"
          else
            echo "No previous $PACKAGE_ARCH package exists; testing a clean install."
          fi
          pacman -U --noconfirm "$PACKAGE_FILE"
          omaroll --version
          if [ "$PACKAGE_ARCH" = x86_64 ]; then
            bash packaging/arch/check-omarchy-stable.sh /usr/bin/omaroll
          fi
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            omaroll --render /tmp/omaroll-package-smoke.png --render-view grid --render-size 560x420
          test -s /tmp/omaroll-package-smoke.png
          rm -f /tmp/omaroll-package-video.png
          xvfb-run -a env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=rhi \
            QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1 QT_AUDIO_BACKEND=pulseaudio \
            PULSE_SERVER=unix:/nonexistent PIPEWIRE_REMOTE=omaroll-no-audio \
            timeout 30 omaroll --render /tmp/omaroll-package-video.png --render-view video
          test "$(magick identify -format '%m %wx%h' /tmp/omaroll-package-video.png)" = 'PNG 1280x820'
          pacman -U --noconfirm "$PACKAGE_FILE"
          pacman -R --noconfirm omaroll
          test ! -e /usr/bin/omaroll
          pacman -U --noconfirm "$PACKAGE_FILE"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.job }}-${{ matrix.arch }}
          path: '**/test-results.xml'
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [source, package]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download source and packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for file in "omaroll-$VERSION.tar.gz" "PKGBUILD-$VERSION" \
            "omaroll-$VERSION-1-x86_64.pkg.tar.zst" "omaroll-$VERSION-1-aarch64.pkg.tar.zst"; do
            test -f "$file"
          done
          sha256sum "omaroll-$VERSION.tar.gz" omaroll-*.pkg.tar.zst "PKGBUILD-$VERSION" > SHA256SUMS
          awk -v heading="## $VERSION" '$0 == heading {copy=1; next} /^## /{copy=0} copy' \
            ../CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          # Credit everyone but the maintainer whose commits are in this release.
          # A mention in the notes also lists them under the release's contributors.
          if previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)"; then
            contributors="$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_SHA" \
              --paginate --jq '.commits[].author.login // empty' \
              | grep -vxE 'btsouth|.*\[bot\]' | sort -u | sed 's/^/@/' | paste -sd ' ' -)" || contributors=""
            if [ -n "$contributors" ]; then
              printf '\n### Contributors\n\nThanks to %s for their work on this release.\n' \
                "$(echo "$contributors" | sed 's/ /, /g')" >> RELEASE_NOTES.md
            fi
          fi
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "omaroll-$VERSION.tar.gz"
          omaroll-*.pkg.tar.zst
          "PKGBUILD-$VERSION"
          SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "Omaroll $VERSION"
          --notes-file RELEASE_NOTES.md
