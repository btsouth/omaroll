name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private filenames and paths from screenshots or logs.
  - type: input
    id: version
    attributes:
      label: Omaroll version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Omarchy version, active theme, graphics hardware
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Include the file format and whether it is local, removable, or on a network mount.
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the shortest steps that reproduce the problem and what you expected.
    validations:
      required: true
