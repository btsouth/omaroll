name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private filenames and paths from screenshots or logs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Open Settings, choose Copy diagnostics in About, then paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Include the file format and whether it is local, removable, or on a network mount.
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the shortest steps that reproduce the problem and what you expected.
    validations:
      required: true
