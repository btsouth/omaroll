name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private filenames and paths from screenshots or logs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Omaroll 1.19 or newer, open Settings, choose Copy diagnostics in About, then paste the result here.
      render: text
  - type: input
    id: version
    attributes:
      label: Omaroll version
      description: Skip this if you pasted diagnostics. `omaroll --version` prints it.
      placeholder: 1.18.0
  - type: input
    id: system
    attributes:
      label: System
      description: Skip this if you pasted diagnostics.
      placeholder: Omarchy version, active theme, graphics hardware
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: Include the file format and whether it is local, removable, or on a network mount.
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the shortest steps that reproduce the problem and what you expected.
    validations:
      required: true
